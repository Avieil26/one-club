name: New card releases validation
on:
  push:
    branches: ['preview/new-cards-20261024']
  pull_request:
    paths: ['assets/images/cards/recent/**', 'assets/data/recentCards20261024.json', 'scripts/verify-new-cards*', '.github/workflows/new-cards-20261024.yml']
permissions:
  contents: read
concurrency:
  group: new-cards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_OFFLINE: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:web -- --max-workers 2
      - run: npm run verify:mobile && npm run verify:startup && node scripts/verify-gallery.mjs
      - run: npx expo export -p android --output-dir /tmp/new-cards-android --max-workers 2
      - run: npx eslint components/RecentCardInfo.tsx lib/recentCards.ts lib/recentCardArt.ts lib/fcPlayers.ts lib/marketPrices.ts lib/playerFilter.ts api/market-prices.js
      - name: Existing repository lint baseline
        continue-on-error: true
        run: npm run lint
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: All editions and bilingual phone layouts
        run: node scripts/verify-new-cards-ui.mjs
        timeout-minutes: 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-cards-ui-screenshots
          path: preview/new-cards-qa/
