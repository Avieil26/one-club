name: Community Preview checks
on:
  pull_request:
    branches: ['fix/android-mobile-20261020', 'preview/community-sbc-20261020']
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: community-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.head_ref == 'preview/community-sbc-20261020' || github.head_ref == 'preview/site-polish-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_OFFLINE: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/generate-sbc-ready-squad.mjs
      - run: npm run typecheck
      - run: npm run verify:mobile
      - run: npm run verify:startup
      - run: npm run build:web -- --max-workers 2
      - name: Export Android JavaScript
        run: npx expo export -p android --output-dir /tmp/fc27-android-check --max-workers 2
      - name: Lint changed feature files
        run: npx eslint components/CountryPicker.tsx components/CommunityActivityUI.tsx components/PartnerSessions.tsx components/CareerJourneys.tsx components/SbcRewardVisual.tsx components/SbcRewardPack.tsx components/CookieNotice.tsx lib/legal.ts components/SbcSurface.tsx components/SbcPlayerSelection.tsx lib/sbcItemScore.ts lib/sbcPointOptions.ts lib/sbcEligibility.ts lib/sbcPlanPrices.ts components/SquadPitch.tsx components/ItemScore.tsx components/SbcPointsSolution.tsx components/SbcClassicSolution.tsx lib/sbcVerified.ts lib/sbcClassic.ts lib/chemistry.ts lib/sbcCalculator.ts assets/sbcRewardAssets.ts 'app/(tabs)/career.tsx' 'app/(tabs)/sbc.tsx' 'app/sbc/[id].tsx' 'app/grounds/new.tsx' components/GroundsV22Screen.tsx lib/countries.ts lib/sbcTileTheme.ts lib/sbcLocalization.ts lib/selectors.ts
      - name: Record repository lint baseline
        continue-on-error: true
        run: npm run lint
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-polish-ui.mjs
        if: github.head_ref == 'preview/site-polish-20261021'
        timeout-minutes: 5
      - run: node scripts/verify-sbc-solutions-ui.mjs
        timeout-minutes: 5
      - run: node scripts/verify-community-ui.mjs
        timeout-minutes: 5
      - run: node scripts/verify-site-polish.mjs
