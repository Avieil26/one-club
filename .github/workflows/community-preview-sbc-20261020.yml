name: Community Preview checks
on:
  pull_request:
    branches: ['fix/android-mobile-20261020']
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: community-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  reward-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/collect-sbc-art-assets.mjs
