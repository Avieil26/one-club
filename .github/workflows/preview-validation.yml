name: Preview candidate validation

on:
  push:
    branches:
      - preview/star-performers-20261018
      - preview/fc27-complete-english-starsafe-20261018
      - preview/fc27-20118-english-starsafe-fix-20261019
      - preview/fc27-20118-orphan-promo-cards-fix-20261019
  pull_request:
    branches:
      - codex/grounds-prod-release
      - preview/validation-base-20118-20261019
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "assets/data/totw.json"
      - "assets/data/starPerformers.json"
      - "assets/data/futureStars.json"
      - "assets/data/players.json"
      - "assets/data/heroes.json"
      - "assets/data/destinedEditions.json"
      - "lib/iconPlayers.ts"
      - "lib/fcPlayers.ts"
      - "lib/specialCards.ts"
      - "assets/data/marketPrices.json"
      - "assets/data/priceEaIds.json"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/preview-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint (existing repository lint debt is reported but does not block build validation)
        continue-on-error: true
        run: npm run lint
      - name: Export web build
        run: npx expo export -p web
      - name: Verify exact catalogue count and special-card rows
        run: node scripts/verify-preview-catalogue.mjs
