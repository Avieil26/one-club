name: preview-build-check

on:
  push:
    branches:
      - preview/fut-champions-v2-ui

jobs:
  expo-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export -p web

      - name: Browser smoke test for authenticated shell
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory dist >/tmp/fc27-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          cat >/tmp/fc27-auth-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();

          const errors = [];
          page.on('pageerror', (error) => errors.push("PAGEERROR: " + error.message));
          page.on('console', (message) => {
            if (message.type() === 'error') errors.push("CONSOLE: " + message.text());
          });

          await page.addInitScript(() => {
            const now = Math.floor(Date.now() / 1000);
            const header = btoa(JSON.stringify({ alg: 'none', typ: 'JWT' })).replace(/=/g, '');
            const payload = btoa(JSON.stringify({
              sub: '00000000-0000-0000-0000-000000000001',
              email: 'smoke@example.com',
              role: 'authenticated',
              exp: now + 3600,
              aud: 'authenticated',
            })).replace(/=/g, '');
            const token = header + "." + payload + ".";
            localStorage.setItem('sb-hxjgphhcspzjnkkzdmpk-auth-token', JSON.stringify({
              access_token: token,
              refresh_token: 'smoke-refresh-token',
              expires_in: 3600,
              expires_at: now + 3600,
              token_type: 'bearer',
              user: {
                id: '00000000-0000-0000-0000-000000000001',
                aud: 'authenticated',
                role: 'authenticated',
                email: 'smoke@example.com',
                user_metadata: { full_name: 'Smoke User' },
                app_metadata: { provider: 'google', providers: ['google'] },
                created_at: new Date().toISOString(),
              },
            }));
          });

          await page.route('**://*.supabase.co/**', async (route) => {
            const url = route.request().url();
            if (url.includes('/auth/v1/')) {
              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ access_token: '', refresh_token: '', user: null }),
              });
              return;
            }
            await route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify([]),
            });
          });

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(1500);

          const bodyText = await page.locator('body').innerText();
          const bodyHtml = await page.locator('body').innerHTML();

          if (bodyHtml.trim().length < 500) {
            throw new Error('Authenticated shell rendered an effectively blank document');
          }
          if (!/1 CLUB|המגרש|קריירה|SBC|מרקט/.test(bodyText)) {
            throw new Error('Authenticated shell did not render expected app text. Body: ' + bodyText.slice(0, 1000));
          }
          if (errors.length) {
            throw new Error(errors.join('\\n'));
          }

          console.log('AUTH_SHELL_SMOKE_PASS');
          await browser.close();
          EOF
          node /tmp/fc27-auth-smoke.mjs
