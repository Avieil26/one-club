name: preview-build-check

on:
  push:
    branches:
      - preview/fut-champions-v2-ui

jobs:
  expo-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export -p web
