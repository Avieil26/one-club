name: preview-build-check

on:
  push:
    branches:
      - preview/fut-champions-v2-ui

jobs:
  expo-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export -p web

      - name: Browser smoke test for authenticated shell and OAuth callback
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory dist >/tmp/fc27-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          cat >/tmp/fc27-auth-smoke.cjs <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const sessionUserId = '00000000-0000-0000-0000-000000000001';
            const now = Math.floor(Date.now() / 1000);
            const header = Buffer.from(JSON.stringify({ alg: 'none', typ: 'JWT' })).toString('base64url');
            const payload = Buffer.from(JSON.stringify({
              sub: sessionUserId,
              email: 'smoke@example.com',
              role: 'authenticated',
              exp: now + 3600,
              aud: 'authenticated',
            })).toString('base64url');
            const token = header + '.' + payload + '.';

            const session = {
              access_token: token,
              refresh_token: 'smoke-refresh-token',
              expires_in: 3600,
              expires_at: now + 3600,
              token_type: 'bearer',
              user: {
                id: sessionUserId,
                aud: 'authenticated',
                role: 'authenticated',
                email: 'smoke@example.com',
                user_metadata: { full_name: 'Smoke User' },
                app_metadata: { provider: 'google', providers: ['google'] },
                created_at: new Date().toISOString(),
              },
            };

            async function setupSupabase(page) {
              await page.route('**://*.supabase.co/**', async (route) => {
                const url = route.request().url();
                if (url.includes('/auth/v1/token')) {
                  await route.fulfill({
                    status: 200,
                    contentType: 'application/json',
                    body: JSON.stringify(session),
                  });
                  return;
                }
                if (url.includes('/auth/v1/')) {
                  await route.fulfill({
                    status: 200,
                    contentType: 'application/json',
                    body: JSON.stringify({ access_token: session.access_token, refresh_token: session.refresh_token, user: session.user }),
                  });
                  return;
                }
                await route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify([]),
                });
              });
            }

            async function assertVisibleApp(page, label) {
              await page.waitForTimeout(1800);
              const bodyText = await page.locator('body').innerText();
              const bodyHtml = await page.locator('body').innerHTML();
              if (bodyHtml.trim().length < 500) {
                throw new Error(label + ': effectively blank document');
              }
              if (!/1 CLUB|המגרש|קריירה|SBC|מרקט/.test(bodyText)) {
                throw new Error(label + ': expected app UI not found. Body: ' + bodyText.slice(0, 1200));
              }
            }

            async function assertNoErrors(page, label) {
              const errors = [];
              page.on('pageerror', (error) => errors.push(label + ' PAGEERROR: ' + error.message));
              page.on('console', (message) => {
                if (message.type() === 'error') errors.push(label + ' CONSOLE: ' + message.text());
              });
              return errors;
            }

            const browser = await chromium.launch({ headless: true });

            const callbackPage = await browser.newPage();
            const callbackErrors = await assertNoErrors(callbackPage, 'callback');
            await setupSupabase(callbackPage);
            await callbackPage.goto('http://127.0.0.1:4173/?code=smoke-code&state=smoke-state', { waitUntil: 'networkidle' });
            await assertVisibleApp(callbackPage, 'OAuth callback');
            if (callbackErrors.length) throw new Error(callbackErrors.join('\n'));

            const shellPage = await browser.newPage();
            const shellErrors = await assertNoErrors(shellPage, 'authenticated');
            await shellPage.addInitScript(({ session }) => {
              localStorage.setItem(
                'sb-hxjgphhcspzjnkkzdmpk-auth-token',
                JSON.stringify(session),
              );
            }, { session });
            await setupSupabase(shellPage);
            await shellPage.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await assertVisibleApp(shellPage, 'Authenticated shell');
            if (shellErrors.length) throw new Error(shellErrors.join('\n'));

            console.log('OAUTH_CALLBACK_SMOKE_PASS');
            console.log('AUTH_SHELL_SMOKE_PASS');
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          EOF
          NODE_PATH="$PWD/node_modules" node /tmp/fc27-auth-smoke.cjs
